name = "gately-auth-example"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "My App"
GATELY_AUTH_BASE_URL = "http://localhost:8787"

# Cloudflare D1 — user accounts, sessions, OAuth tokens
[[d1_databases]]
binding = "AUTH_DB"
database_name = "gately-auth-example"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# KV — magic links, OTP codes, rate-limit counters, session cache
[[kv_namespaces]]
binding = "AUTH_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Required secrets (set with: npx wrangler secret put <KEY>)
# GATELY_AUTH_SECRET     — signs tokens and cookies
# GATELY_API_KEY         — Gately transactional email (optional but recommended)
# GOOGLE_CLIENT_SECRET   — Google OAuth (optional)
# GITHUB_CLIENT_SECRET   — GitHub OAuth (optional)

[observability.logs]
enabled = true
