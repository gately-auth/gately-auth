name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check (packages only)
        run: pnpm --filter "@gately/auth-*" -r typecheck

      - name: Build (packages only)
        run: pnpm --filter "@gately/auth-*" -r build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint
